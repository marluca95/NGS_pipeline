# Input: folder that contains files like
# GFB-64257_DMF5CDR3bGIG011xpositive.filtered.PASS.aa.tsv
input_dir: /cluster/project/reddy/katja/NGS_pipeline/data/P3481_LUCA-TCRDMF5/extracted

# Output: one CSV per peptide + run summary + logs
output_dir: /cluster/project/reddy/katja/NGS_pipeline/data/P3481_LUCA-TCRDMF5/04_variant_labeling/Q20/monotonic/

# File matching and AA sequence column
input_glob: "*.filtered.PASS.aa.tsv"
aa_column: "aa_seq"

# Same pseudocount logic as notebook enrichment step
pseudocount: 1e-9

# Logging
logs_subdir: "_logs"
log_name: "script4_variant_labeling.log"

# Suffix conventions parsed from token after final underscore
lib_suffix: "orilib"
neg_suffix: "2xnegative"
positive_suffixes:
  pos1x: "1xpositive"
  pos2x: "2xpositive"
positive_order:
  - pos1x
  - pos2x
required_conditions:
  - neg
  - pos1x
  - pos2x

# Optional parse prefix before token
file_token_prefix: "DMF5CDR3b"

# Positive-selection mode used by script4_variant_labeling.py
# valid strings = "single_positive", "combined_positive", "monotonic_strict"
positive_mode: "monotonic_strict"

# Required only when positive_mode: single_positive
# valid strings = "pos1x", "pos2x"
single_positive_source: "pos2x"

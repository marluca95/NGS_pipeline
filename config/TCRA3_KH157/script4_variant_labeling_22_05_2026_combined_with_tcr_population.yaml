# Recreate the KH157 combined variant-labeling tables with the new
# tcr_population column. This writes to a new output directory and does not
# overwrite existing KH157 variant-labeling outputs.

# Input: folder that contains files like
# GFB-66696_clibKH1573xpositive.filtered.PASS.aa.tsv
input_dir: /cluster/project/reddy/katja/NGS_pipeline/data/P3569_LUCA-TCRA3_KH157/03_extracted/22_05_2026_KH157/

# Output: one CSV per peptide + run summary + logs
output_dir: /cluster/project/reddy/katja/NGS_pipeline/data/P3569_LUCA-TCRA3_KH157/04_variant_labeling/22_05_2026/combined_with_tcr_population/

# File matching and AA sequence column
input_glob: "*.filtered.PASS.aa.tsv"
aa_column: "aa_seq"

# Same pseudocount logic as notebook enrichment step
pseudocount: 1e-9

# Logging
logs_subdir: "_logs"
log_name: "script4_variant_labeling.log"
run_label: "KH157_22_05_2026_combined_with_tcr_population"

# Suffix conventions parsed from token after "_clib"
file_token_prefix: "clib"
lib_suffix: "originallib"
neg_suffix: "2xnegative"
positive_suffixes:
  pos3x: "3xpositive"
  pos3x1x: "31xpositive"
positive_order:
  - pos3x
  - pos3x1x

# Peptides missing one of these conditions are skipped
required_conditions:
  - neg
  - pos3x
  - pos3x1x

# Positive-selection mode used by script4_variant_labeling.py
# valid strings = "single_positive", "combined_positive", "monotonic_strict"
positive_mode: "combined_positive"

# Required only when positive_mode: single_positive
# valid strings = "pos3x", "pos3x1x"
single_positive_source: "pos3x"
